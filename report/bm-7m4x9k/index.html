<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>施術レポート（全3枚）</title>
  <meta name="description" content="今回の施術で見えた全身のバランス、肩と脇の硬さ、左腕のねじれと整える順番をまとめた3枚の施術レポートです。" />

  <!-- OGP for clean LINE / SNS card preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="施術レポート（全3枚）" />
  <meta property="og:description" content="全身のバランス・肩と脇の硬さ・左腕のねじれと整える順番をわかりやすくまとめた施術レポート" />
  <meta property="og:url" content="https://promisefree-cmyk.github.io/trip/report/bm-7m4x9k/" />
  <meta property="og:image" content="https://promisefree-cmyk.github.io/trip/report/bm-7m4x9k/01_stance_frontline.png?v=2" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --bg: #F3F5F8;
      --surface: #FFFFFF;
      --ink: #0F172A;
      --muted: #475569;
      --border: #E2E8F0;
      --accent: #0284C7;
      --accent-dark: #0369A1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 56px;
    }

    /* Sticky sleek top navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 14px 10px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .brand-bar {
      width: 14px;
      height: 2.5px;
      background: var(--accent);
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: #F1F5F9;
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .nav-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 6px 8px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      background: #F8FAFC;
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.18s ease;
    }
    .nav-tab:active, .nav-tab.active {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    /* Main Column */
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .intro-hint {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .sheet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      scroll-margin-top: 106px;
    }
    .sheet-img-wrap {
      display: block;
      width: 100%;
      background: #F4F6F9;
      cursor: zoom-in;
    }
    .sheet-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .sheet-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #FFFFFF;
    }
    .sheet-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }
    .sheet-sub {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--ink);
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--accent-dark);
    }

    /* Fullscreen Lightbox for pinch/zoom inspection */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 16px;
      min-width: 44px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(15, 23, 42, 0.85);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .page-footer {
      max-width: 560px;
      margin: 28px auto 0;
      padding: 16px 14px 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand"><span class="brand-bar"></span>施術レポート</div>
        <span class="badge">全3枚・スマホ用</span>
      </div>
      <nav class="nav-tabs" aria-label="レポート切り替え">
        <a href="#sheet-1" class="nav-tab active" data-target="sheet-1">① 全身バランス</a>
        <a href="#sheet-2" class="nav-tab" data-target="sheet-2">② 肩・脇の硬さ</a>
        <a href="#sheet-3" class="nav-tab" data-target="sheet-3">③ 左腕・ケア順</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="intro-hint">画像はタップで拡大表示、または各カード下のボタンから高画質のまま保存できます。</p>

    <article id="sheet-1" class="sheet-card">
      <div class="sheet-img-wrap" data-zoom="01_stance_frontline.png?v=2">
        <img class="sheet-img" src="01_stance_frontline.png?v=2" alt="施術レポート①：全身のバランスとクセ" fetchpriority="high" />
      </div>
      <div class="sheet-actions">
        <div>
          <span class="sheet-label">01 / 03｜全身のバランスとクセ</span>
          <span class="sheet-sub">左足前の構え・左坐骨の張り・前傾ラインと対角ねじれ</span>
        </div>
        <div class="btn-group">
          <a class="btn btn-primary" href="01_stance_frontline.png?v=2" download="sejutsu_report_01.png">保存</a>
        </div>
      </div>
    </article>

    <article id="sheet-2" class="sheet-card">
      <div class="sheet-img-wrap" data-zoom="02_scapula_axilla.png?v=2">
        <img class="sheet-img" src="02_scapula_axilla.png?v=2" alt="施術レポート②：肩と脇の硬さ・腕の上がり" loading="lazy" />
      </div>
      <div class="sheet-actions">
        <div>
          <span class="sheet-label">02 / 03｜肩と脇の硬さ・腕の上がり</span>
          <span class="sheet-sub">肩甲下筋と大円筋が肩甲骨を引き続ける仕組み</span>
        </div>
        <div class="btn-group">
          <a class="btn btn-primary" href="02_scapula_axilla.png?v=2" download="sejutsu_report_02.png">保存</a>
        </div>
      </div>
    </article>

    <article id="sheet-3" class="sheet-card">
      <div class="sheet-img-wrap" data-zoom="03_leftarm_care.png?v=2">
        <img class="sheet-img" src="03_leftarm_care.png?v=2" alt="施術レポート③：左腕のねじれと整える順番" loading="lazy" />
      </div>
      <div class="sheet-actions">
        <div>
          <span class="sheet-label">03 / 03｜左腕のねじれと整える順番</span>
          <span class="sheet-sub">手首（尺骨側）から左首への連鎖とケア4ステップ</span>
        </div>
        <div class="btn-group">
          <a class="btn btn-primary" href="03_leftarm_care.png?v=2" download="sejutsu_report_03.png">保存</a>
        </div>
      </div>
    </article>
  </main>

  <footer class="page-footer">
    施術レポート（全3枚）
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="画像拡大表示">
    <button type="button" id="lbClose" class="lightbox-close">閉じる</button>
    <img id="lbImg" src="" alt="拡大画像" />
  </div>

  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    document.querySelectorAll('[data-zoom]').forEach(el => {
      el.addEventListener('click', () => {
        lbImg.src = el.dataset.zoom;
        lb.classList.add('open');
      });
    });
    const closeLb = () => lb.classList.remove('open');
    document.getElementById('lbClose').addEventListener('click', closeLb);
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

    const tabs = document.querySelectorAll('.nav-tab');
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          tabs.forEach(t => t.classList.toggle('active', t.dataset.target === entry.target.id));
        }
      });
    }, { rootMargin: '-35% 0px -55% 0px' });
    document.querySelectorAll('.sheet-card').forEach(c => io.observe(c));
  </script>
</body>
</html>
