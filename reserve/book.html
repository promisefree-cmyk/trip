<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Web予約カレンダー — Rooton Chiropractic</title>
<style>
  :root {
    --bg: #FAF8F5;
    --surface: #FFFFFF;
    --border: #E5DFD5;
    --green: #1B3B2B;
    --green-soft: #EEF4F0;
    --gold: #B88E3E;
    --ink: #0F172A;
    --muted: #526058;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    line-height: 1.75;
  }
  .card {
    max-width: 460px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 14px 36px rgba(27, 59, 43, 0.06);
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
    color: var(--green);
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  p {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 22px;
  }
  .status {
    font-size: 13px;
    color: var(--green);
    background: var(--green-soft);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 22px;
    font-weight: 600;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    background: var(--green);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(27, 59, 43, 0.16);
    transition: opacity 0.2s ease;
  }
  a.btn:hover { opacity: 0.92; }
  a.btn.sub {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--border);
    box-shadow: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
<main class="card">
  <span class="eyebrow">ROOTON CHIROPRACTIC</span>
  <h1>公式Web予約カレンダー</h1>
  <p>杉山 慶彦（WHO基準カイロプラクター）の初診・施術予約ページへご案内します。</p>
  <div id="status" class="status">予約カレンダーへ接続しています…</div>
  <div class="links">
    <a id="btn-booking" class="btn" href="https://www.ac-chiro.com/booking-calendar/%E6%9D%89%E5%B1%B1%E5%85%88%E7%94%9F%E3%81%AE%E5%88%9D%E8%A8%BA%E3%82%AB%E3%82%A4%E3%83%AD-first-visit-mr-sugiyama?referral=service_list_widget">予約カレンダーを開く</a>
    <a class="btn sub" href="https://rootonchiro.com/">公式HPトップへ戻る</a>
  </div>
</main>
<script>
(async function() {
  const OFFICIAL_BOOKING_URL = "https://www.ac-chiro.com/booking-calendar/%E6%9D%89%E5%B1%B1%E5%85%88%E7%94%9F%E3%81%AE%E5%88%9D%E8%A8%BA%E3%82%AB%E3%82%A4%E3%83%AD-first-visit-mr-sugiyama?referral=service_list_widget";
  const statusEl = document.getElementById("status");
  const btnBooking = document.getElementById("btn-booking");

  async function fetchWithTimeout(url, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: "no-store", signal: ctrl.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  let verifiedTarget = "";
  try {
    const epRes = await fetchWithTimeout("../endpoint.json?t=" + Date.now(), 1500);
    if (epRes.ok) {
      const ep = await epRes.json();
      if (ep && typeof ep.chiroTunnelUrl === "string" && ep.chiroTunnelUrl.startsWith("https://")) {
        const candidate = ep.chiroTunnelUrl.replace(/\/+$/, "") + "/book.html";
        const ping = await fetchWithTimeout(candidate, 2000);
        if (ping.ok) {
          verifiedTarget = candidate;
        }
      }
    }
  } catch (_err) {
    verifiedTarget = "";
  }

  const finalUrl = verifiedTarget || OFFICIAL_BOOKING_URL;
  btnBooking.href = finalUrl;
  statusEl.textContent = "公式予約カレンダーへ移動しています（自動で開かない場合は下のボタンを押してください）";
  window.location.replace(finalUrl);
})();
</script>
</body>
</html>
