<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>予約管理カレンダー・売上集計（スタッフ用） — 接続中</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#faf9f6; color:#1c2621; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; box-sizing:border-box; }
  .card { max-width:460px; width:100%; background:#ffffff; border:1px solid #e4e2dc; border-radius:20px; padding:32px 28px; box-shadow:0 12px 36px rgba(28,38,33,0.07); text-align:center; }
  h1 { font-size:19px; margin:0 0 10px; color:#1e4d3b; letter-spacing:0.02em; font-weight:700; }
  p { font-size:14px; color:#5a665f; line-height:1.65; margin:0 0 20px; }
  .status { font-size:13px; color:#2a634d; background:#eef5f1; padding:11px 14px; border-radius:12px; margin-bottom:20px; font-weight:600; }
  .links { display:flex; flex-direction:column; gap:10px; }
  a.btn { display:block; text-decoration:none; padding:14px 18px; border-radius:12px; font-weight:700; font-size:14.5px; background:#1e4d3b; color:#fff; box-shadow:0 4px 12px rgba(30,77,59,0.18); }
</style>
</head>
<body>
<div class="card">
  <h1>予約管理カレンダー・売上集計（スタッフ用）</h1>
  <p>安全な暗号化通信で予約サーバーへ接続しています…</p>
  <div id="status" class="status">接続先を確認中…</div>
  <div class="links">
    <a id="btn-tunnel" class="btn" href="https://animal-honest-blog-swimming.trycloudflare.com/admin.html">画面を開く</a>
  </div>
</div>
<script>
(async function() {
  const statusEl = document.getElementById('status');
  const btnTunnel = document.getElementById('btn-tunnel');
  let tunnelBase = "https://animal-honest-blog-swimming.trycloudflare.com/";
  try {
    const gRes = await fetch('https://api.github.com/gists/9eea03e785382031cabb2892c490b3cd?t=' + Date.now(), { cache: 'no-store' });
    if (gRes.ok) {
      const gJson = await gRes.json();
      if (gJson.files && gJson.files['endpoint.json']) {
        const ep = JSON.parse(gJson.files['endpoint.json'].content);
        if (ep.chiroTunnelUrl) tunnelBase = ep.chiroTunnelUrl;
      }
    }
  } catch (e) {}
  if (!tunnelBase) {
    try {
      const eRes = await fetch('../endpoint.json?t=' + Date.now(), { cache: 'no-store' });
      if (eRes.ok) {
        const ep = await eRes.json();
        if (ep.chiroTunnelUrl) tunnelBase = ep.chiroTunnelUrl;
      }
    } catch (e) {}
  }
  if (tunnelBase) {
    const target = tunnelBase.replace(/\/+$/, '') + '/admin.html';
    btnTunnel.href = target;
    statusEl.textContent = '接続先を確認しました。移動します…';
    window.location.replace(target);
  } else {
    statusEl.textContent = '上のボタンをタップして開いてください。';
  }
})();
</script>
</body>
</html>
