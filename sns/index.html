<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#F4F6F9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StealthFlow" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>StealthFlow Master — 固定アクセス入口</title>
  <style>
    :root {
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #475569;
      --soft: #64748B;
      --accent: #0F5132;
      --accent-soft: #ECFDF5;
      --accent-border: #A7F3D0;
      --danger: #B91C1C;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --radius: 18px;
    }
    body[data-role="personal"] {
      --accent: #B45309;
      --accent-soft: #FEF3C7;
      --accent-border: #FDE68A;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .shell {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 22px 24px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      flex-shrink: 0;
    }
    .lock-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .lead {
      margin: 0 0 20px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--muted);
    }
    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      background: #F1F5F9;
      border-radius: 13px;
      margin-bottom: 18px;
    }
    .role-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      padding: 11px 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .role-btn.active {
      background: #FFFFFF;
      color: var(--accent);
      border-color: var(--accent-border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 7px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 13px 46px 13px 14px;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      font-size: 16px;
      letter-spacing: 0.05em;
      background: #F8FAFC;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    input:focus {
      border-color: var(--accent);
      background: #FFFFFF;
    }
    .eye-btn {
      position: absolute;
      right: 8px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--soft);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 13px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      margin: 0;
    }
    .primary-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .primary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .primary-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .ghost-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #FFFFFF;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .status-box {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 600;
    }
    .status-box.show { display: block; }
    .status-box.info {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
    }
    .status-box.error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }
    .auto-panel {
      display: none;
      padding: 18px 16px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      text-align: center;
    }
    .auto-panel.show { display: block; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 10px;
      border: 3px solid rgba(15, 81, 50, 0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auto-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .auto-sub {
      font-size: 12.5px;
      color: var(--muted);
    }
    .meta-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--soft);
      flex-wrap: wrap;
    }
    .text-link {
      border: none;
      background: none;
      color: var(--soft);
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body data-role="work">
  <main class="shell">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>StealthFlow Master</span>
      </div>
      <span class="lock-pill">AES-256 暗号化入口</span>
    </div>

    <h1>固定アクセス入口</h1>
    <p class="lead">
      自宅PCの最新接続先をブラウザ内で復号し、そのまま安全にログインします。URLは毎回自動で最新へ切り替わります。
    </p>

    <div class="role-switch" role="tablist" aria-label="接続先モード">
      <button type="button" class="role-btn active" id="roleWorkBtn" data-role="work" role="tab" aria-selected="true">仕事用マスター</button>
      <button type="button" class="role-btn" id="rolePersonalBtn" data-role="personal" role="tab" aria-selected="false">個人用マスター</button>
    </div>

    <section id="autoPanel" class="auto-panel" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="auto-title" id="autoTitle">最新の接続先へ自動ログイン中…</div>
      <div class="auto-sub" id="autoSub">暗号化ビーコンを復号し、サーバーの応答を確認しています</div>
      <button type="button" class="ghost-btn" id="cancelAutoBtn">手動入力に切り替える</button>
    </section>

    <form id="portalForm" autocomplete="on">
      <label class="field-label" for="passcodeInput">合言葉（パスコード）</label>
      <div class="input-wrap">
        <input id="passcodeInput" name="passcode" type="password" required placeholder="合言葉を入力" autocomplete="current-password" />
        <button type="button" class="eye-btn" id="toggleEyeBtn" aria-label="表示切替">表示</button>
      </div>
      <label class="remember-row">
        <input type="checkbox" id="rememberChk" checked />
        <span>この端末に合言葉を記憶する（次回から1タップ接続）</span>
      </label>
      <button type="submit" class="primary-btn" id="connectBtn">復号して管理画面を開く</button>
    </form>

    <div id="statusBox" class="status-box" role="alert"></div>

    <div class="meta-foot">
      <span id="beaconTimeLabel">接続情報: 待機中</span>
      <button type="button" class="text-link hidden" id="forgetDeviceBtn">端末の記憶を削除</button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const STORAGE_PASSCODE_KEY = 'sf_portal_passcode_v1';
      const STORAGE_ROLE_KEY = 'sf_portal_role_v1';

      const params = new URLSearchParams(window.location.search);
      const queryRole = (params.get('role') || '').toLowerCase();
      const manualMode = params.get('manual') === '1';

      let selectedRole =
        queryRole === 'personal'
          ? 'personal'
          : queryRole === 'work' || queryRole === 'business'
            ? 'work'
            : localStorage.getItem(STORAGE_ROLE_KEY) === 'personal'
              ? 'personal'
              : 'work';

      let autoCancelled = false;

      const roleWorkBtn = document.getElementById('roleWorkBtn');
      const rolePersonalBtn = document.getElementById('rolePersonalBtn');
      const portalForm = document.getElementById('portalForm');
      const passcodeInput = document.getElementById('passcodeInput');
      const toggleEyeBtn = document.getElementById('toggleEyeBtn');
      const rememberChk = document.getElementById('rememberChk');
      const connectBtn = document.getElementById('connectBtn');
      const statusBox = document.getElementById('statusBox');
      const autoPanel = document.getElementById('autoPanel');
      const autoTitle = document.getElementById('autoTitle');
      const autoSub = document.getElementById('autoSub');
      const cancelAutoBtn = document.getElementById('cancelAutoBtn');
      const beaconTimeLabel = document.getElementById('beaconTimeLabel');
      const forgetDeviceBtn = document.getElementById('forgetDeviceBtn');

      function applyRole(role) {
        selectedRole = role === 'personal' ? 'personal' : 'work';
        document.body.setAttribute('data-role', selectedRole);
        roleWorkBtn.classList.toggle('active', selectedRole === 'work');
        roleWorkBtn.setAttribute('aria-selected', String(selectedRole === 'work'));
        rolePersonalBtn.classList.toggle('active', selectedRole === 'personal');
        rolePersonalBtn.setAttribute('aria-selected', String(selectedRole === 'personal'));
        try {
          localStorage.setItem(STORAGE_ROLE_KEY, selectedRole);
        } catch (_) {}
      }

      function showStatus(kind, msg) {
        statusBox.className = 'status-box show ' + kind;
        statusBox.textContent = msg;
      }

      function clearStatus() {
        statusBox.className = 'status-box';
        statusBox.textContent = '';
      }

      function refreshForgetVisibility() {
        const hasSaved = Boolean(localStorage.getItem(STORAGE_PASSCODE_KEY));
        forgetDeviceBtn.classList.toggle('hidden', !hasSaved);
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      async function decryptBeacon(beacon, passcode) {
        const enc = new TextEncoder();
        const salt = b64ToBytes(beacon.salt);
        const iv = b64ToBytes(beacon.iv);
        const ct = b64ToBytes(beacon.ct);
        const iter = Number(beacon.iter || 150000);

        const baseKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(passcode),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        const aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
        return JSON.parse(new TextDecoder().decode(plainBuf));
      }

      function isSafeHttpsOrigin(urlStr) {
        try {
          const u = new URL(urlStr);
          return u.protocol === 'https:' && Boolean(u.hostname) && !u.username && !u.password;
        } catch (_) {
          return false;
        }
      }

      async function probeHealth(origin, timeoutMs) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(origin + '/api/health?t=' + Date.now(), {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            signal: ctrl.signal
          });
          if (!res.ok) return false;
          const json = await res.json();
          return Boolean(json && json.ok);
        } catch (_) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      function submitAutoLogin(origin, passcode, role) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = origin + '/auth/enter';
        form.style.display = 'none';

        const pInput = document.createElement('input');
        pInput.type = 'hidden';
        pInput.name = 'passcode';
        pInput.value = passcode;

        const nInput = document.createElement('input');
        nInput.type = 'hidden';
        nInput.name = 'next';
        nInput.value = role === 'personal' ? '/personal' : '/work';

        form.appendChild(pInput);
        form.appendChild(nInput);
        document.body.appendChild(form);
        form.submit();
      }

      async function connectWithPasscode(passcode, isAuto) {
        clearStatus();
        const cleanPass = String(passcode || '').trim();
        if (!cleanPass) {
          showStatus('error', '合言葉を入力してください。');
          return;
        }

        connectBtn.disabled = true;
        if (isAuto) {
          portalForm.classList.add('hidden');
          autoPanel.classList.add('show');
          autoTitle.textContent =
            selectedRole === 'personal' ? '個人用マスターへ自動接続中…' : '仕事用マスターへ自動接続中…';
          autoSub.textContent = '暗号化ビーコンを読み込み、自宅PCの応答を確認しています';
        } else {
          showStatus('info', '最新の接続先を復号して確認しています…');
        }

        try {
          const beaconRes = await fetch('./beacon.json?t=' + Date.now(), { cache: 'no-store' });
          if (!beaconRes.ok) {
            throw new Error('BEACON_FETCH_FAILED');
          }
          const beacon = await beaconRes.json();
          if (beacon.updatedAt) {
            const dt = new Date(beacon.updatedAt);
            if (!Number.isNaN(dt.getTime())) {
              beaconTimeLabel.textContent =
                '最終同期: ' +
                dt.toLocaleString('ja-JP', {
                  month: '2-digit',
                  day: '2-digit',
                  hour: '2-digit',
                  minute: '2-digit'
                });
            }
          }

          let payload;
          try {
            payload = await decryptBeacon(beacon, cleanPass);
          } catch (_) {
            throw new Error('INVALID_PASSCODE');
          }

          const origin = String(payload && payload.url ? payload.url : '').replace(/\/+$/, '');
          if (!isSafeHttpsOrigin(origin)) {
            throw new Error('INVALID_TARGET');
          }

          if (autoCancelled && isAuto) return;

          if (isAuto) {
            autoSub.textContent = 'サーバーの稼働を確認中（最大8秒）…';
          } else {
            showStatus('info', '合言葉を確認しました。自宅PCの応答を確認しています…');
          }

          let alive = await probeHealth(origin, 7500);
          if (!alive) {
            await new Promise((r) => setTimeout(r, 1500));
            alive = await probeHealth(origin, 7500);
          }

          if (autoCancelled && isAuto) return;

          if (!alive) {
            throw new Error('SERVER_OFFLINE');
          }

          if (rememberChk.checked) {
            try {
              localStorage.setItem(STORAGE_PASSCODE_KEY, cleanPass);
            } catch (_) {}
          } else if (!isAuto) {
            try {
              localStorage.removeItem(STORAGE_PASSCODE_KEY);
            } catch (_) {}
          }
          refreshForgetVisibility();

          if (isAuto) {
            autoTitle.textContent = '接続完了！画面へ移動しています…';
            autoSub.textContent = '安全なHTTPSセッションを開始しています';
          } else {
            showStatus('info', '接続確認OK！管理画面へ自動ログインしています…');
          }

          submitAutoLogin(origin, cleanPass, selectedRole);
        } catch (err) {
          connectBtn.disabled = false;
          autoPanel.classList.remove('show');
          portalForm.classList.remove('hidden');

          if (err.message === 'INVALID_PASSCODE') {
            if (isAuto) {
              localStorage.removeItem(STORAGE_PASSCODE_KEY);
              refreshForgetVisibility();
              showStatus('error', '保存されていた合言葉が変更されています。新しい合言葉を入力してください。');
            } else {
              showStatus('error', '合言葉が違います。大文字・小文字やハイフンをご確認ください。');
            }
          } else if (err.message === 'SERVER_OFFLINE') {
            showStatus(
              'error',
              '自宅PCのサーバーから応答がありません。PC再起動直後は30秒〜1分ほど待ってからもう一度「復号して管理画面を開く」を押してください。'
            );
          } else {
            showStatus('error', '接続情報の取得に失敗しました。電波状況をご確認のうえ再試行してください。');
          }
        }
      }

      roleWorkBtn.addEventListener('click', () => applyRole('work'));
      rolePersonalBtn.addEventListener('click', () => applyRole('personal'));

      toggleEyeBtn.addEventListener('click', () => {
        const isPw = passcodeInput.type === 'password';
        passcodeInput.type = isPw ? 'text' : 'password';
        toggleEyeBtn.textContent = isPw ? '隠す' : '表示';
      });

      cancelAutoBtn.addEventListener('click', () => {
        autoCancelled = true;
        autoPanel.classList.remove('show');
        portalForm.classList.remove('hidden');
        connectBtn.disabled = false;
        passcodeInput.focus();
      });

      forgetDeviceBtn.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_PASSCODE_KEY);
        passcodeInput.value = '';
        refreshForgetVisibility();
        showStatus('info', 'この端末に保存されていた合言葉を削除しました。');
      });

      portalForm.addEventListener('submit', (e) => {
        e.preventDefault();
        autoCancelled = false;
        connectWithPasscode(passcodeInput.value, false);
      });

      applyRole(selectedRole);
      refreshForgetVisibility();

      const savedPass = localStorage.getItem(STORAGE_PASSCODE_KEY);
      if (savedPass && !manualMode) {
        passcodeInput.value = savedPass;
        connectWithPasscode(savedPass, true);
      }
    })();
  </script>
</body>
</html>
