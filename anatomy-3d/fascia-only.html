<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'self';" />
  <title>アナトミー筋膜・筋肉 3D へ移動しています…</title>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || '');
        if (!params.has('layer')) {
          params.set('layer', 'fascia');
        }
        var qs = params.toString();
        var hash = window.location.hash || '';
        var dest = './index.html' + (qs ? '?' + qs : '') + hash;
        window.location.replace(dest);
      } catch (e) {
        window.location.replace('./index.html?layer=fascia');
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./index.html?layer=fascia" />
  </noscript>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #FAF8F5;
      color: #1E2420;
      font: 15px/1.6 'Hiragino Sans', 'BIZ UDPGothic', system-ui, sans-serif;
      text-align: center;
    }
    a {
      color: #1B3B2B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <p>一体型アプリへ移動しています。<a href="./index.html?layer=fascia">自動的に切り替わらない場合はこちらをタップしてください</a>。</p>
</body>
</html>
