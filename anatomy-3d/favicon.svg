<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#FAF8F4"/>
  <rect x="3" y="3" width="58" height="58" rx="13.5" stroke="#DFD4C3" stroke-width="1.5"/>
  <!-- 背面〜深層を支える水彩テラコッタの張力ライン -->
  <path
    d="M44 11C22 19 42 45 20 53"
    stroke="#CE7E6B"
    stroke-width="4.4"
    stroke-linecap="round"
    opacity="0.92"
  />
  <!-- Halo Skin-Break（和紙の抜け感） -->
  <path
    d="M20 11C42 19 22 45 44 53"
    stroke="#FAF8F4"
    stroke-width="8.2"
    stroke-linecap="round"
  />
  <!-- 中心となるハニーアンバーの筋膜ライン -->
  <path
    d="M20 11C42 19 22 45 44 53"
    stroke="#CFA058"
    stroke-width="4.6"
    stroke-linecap="round"
  />
  <!-- 交差点の和紙リングノード -->
  <circle cx="32" cy="32" r="5.2" fill="#FAF8F4" stroke="#8F5B18" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="1.9" fill="#CFA058"/>
</svg>
