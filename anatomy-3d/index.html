<html lang="ja" data-theme="light">

  <meta charset="UTF-8" />

  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="アナトミー筋膜・筋肉 3D" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="description" content="仕事や日常の姿勢・スポーツの動きで「縮むところ」と「伸びるところ」、ゆるめる順番を3Dでひと目で確認できる無料セルフケア図鑑。" />
  <meta property="og:title" content="アナトミー筋膜・筋肉 3D — 縮むところ・伸びるところ＆セルフケア図鑑" />
  <meta property="og:description" content="いつもの姿勢や動作で「縮むところ」と「伸びるところ」、ゆるめる順番を筋膜と筋肉の3Dアニメーションで見比べられます。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary" />
  <title>アナトミー筋膜・筋肉 3D — 縮むところ・伸びるところ＆セルフケア図鑑</title>
  <link rel="stylesheet" href="css/app.css?v=20261121b" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header id="app-header" class="app-header">
      <div class="app-brand">
        <span class="app-brand-dot" aria-hidden="true"></span>
        <h1 class="app-title">アナトミー筋膜・筋肉 3D</h1>
      </div>
      <div class="theme-pill-group" role="group" aria-label="画面の明るさ切り替え">
        <button type="button" id="btn-theme-light" class="theme-pill-btn is-active" data-theme-choice="light" aria-pressed="true">
          <span class="theme-pill-chip">通常</span>
        </button>
        <span class="theme-pill-sep" aria-hidden="true">｜</span>
        <button type="button" id="btn-theme-dark" class="theme-pill-btn" data-theme-choice="dark" aria-pressed="false">
          <span class="theme-pill-chip">ダーク</span>
        </button>
      </div>
    </header>

    <main id="workspace" class="unified-workspace">
      <section id="stage-col" class="unified-stage-col" aria-label="3Dアニメーション表示">
        <div id="stage-wrap" class="stage-wrap">
          <div id="stage" class="stage-canvas-host"></div>

          <div class="stage-legend-pill" aria-label="色の見かた">
            <span class="legend-chip is-short">
              <i class="legend-dot" aria-hidden="true"></i>
              <span>縮む</span>
            </span>
            <span class="legend-chip is-long">
              <i class="legend-dot" aria-hidden="true"></i>
              <span>伸びる</span>
            </span>
          </div>

          <div id="stage-loader" class="stage-loader" role="status" aria-live="polite">
            <div class="stage-loader-card">
              <p id="stage-loader-text" class="stage-loader-text">3Dモデルを準備しています…</p>
              <div class="stage-loader-track" aria-hidden="true">
                <span id="stage-loader-fill" class="stage-loader-fill"></span>
              </div>
            </div>
          </div>
        </div>

        <div id="stage-bar" class="unified-stage-bar" role="toolbar" aria-label="3D表示切り替え">
          <div class="layer-switch" role="group" aria-label="筋膜と筋肉の切り替え">
            <button type="button" id="btn-layer-fascia" class="layer-switch-btn is-active" data-layer-mode="fascia" aria-pressed="true">
              <span class="layer-switch-label">筋膜</span>
            </button>
            <button type="button" id="btn-layer-muscle" class="layer-switch-btn" data-layer-mode="muscle" aria-pressed="false">
              <span class="layer-switch-label">筋肉</span>
            </button>
          </div>

          <button type="button" id="btn-play-toggle" class="stage-play-btn" aria-pressed="false">
            <span id="btn-play-label">一時停止</span>
          </button>
        </div>
      </section>

      <section id="panel-col" class="unified-panel-col" aria-label="3ステップ操作と解説">
        <div id="ui-root" class="panel-root"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js?v=20261121b"></script>
  <script>
    if (
      'serviceWorker' in navigator &&
      (location.protocol === 'https:' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1')
    ) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=20261121b').catch(() => {});
      });
    }
  </script>
</body>
</html>
