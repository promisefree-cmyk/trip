<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" id="meta-theme-color" content="#FAF8F5" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="全45種類の日常姿勢・仕事・スポーツアニメーションについて、最初（0%）と最後（100%）の動き・筋膜と筋肉の切り替え・3Dライブ再生を一覧で確認し、番号付きで修正指示をコピーできる確認ページ。" />
  <title>全45アニメーション 最初・最後 一覧チェック表 — アナトミー筋膜・筋肉 3D</title>
  <link rel="stylesheet" href="css/fascia_check_list.css?v=20261118j" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="top-bar">
    <div class="brand-wrap">
      <h1 class="app-title">全45アニメーション 最初・最後 一覧チェック表</h1>
    </div>
    <div class="header-actions">
      <button
        type="button"
        id="btnLayerMode"
        class="theme-pill-btn"
        aria-pressed="false"
        aria-label="筋膜表示と筋肉表示を切り替える"
      >
        <span class="theme-pill-item is-active" data-layer-pill="fascia">筋膜</span>
        <span class="theme-pill-item" data-layer-pill="muscle">筋肉</span>
      </button>
      <button
        type="button"
        id="btnTheme"
        class="theme-pill-btn"
        aria-pressed="false"
        aria-label="画面モードを通常とダークモードで切り替える"
      >
        <span class="theme-pill-item is-active" data-theme-pill="light">通常</span>
        <span class="theme-pill-item" data-theme-pill="dark">ダーク</span>
      </button>
      <a href="index.html" class="viewer-link-btn">メイン3Dアプリを開く</a>
    </div>
  </header>

  <div id="bake-banner" class="bake-banner" role="status" aria-live="polite">
    <div class="bake-banner-inner">
      <div class="bake-head">
        <span id="bake-status-text" class="bake-status-text">3Dモデルを読み込んでいます（画面に映ったカードから順に表示します）…</span>
        <span id="bake-pct" class="bake-pct">0%</span>
      </div>
      <div class="bake-track">
        <div id="bake-fill" class="bake-fill"></div>
      </div>
    </div>
  </div>

  <section class="control-bar" aria-label="分類の絞り込みと修正チェック管理">
    <div class="control-bar-inner">
      <div class="filter-tabs" role="tablist" aria-label="動作分類の絞り込み">
        <button type="button" class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true">
          すべて（45件）
        </button>
        <button type="button" class="filter-tab" data-filter="desk" role="tab" aria-selected="false">
          デスク・手作業
        </button>
        <button type="button" class="filter-tab" data-filter="work" role="tab" aria-selected="false">
          立ち仕事・重作業
        </button>
        <button type="button" class="filter-tab" data-filter="daily" role="tab" aria-selected="false">
          家事・姿勢・カバン
        </button>
        <button type="button" class="filter-tab" data-filter="sport" role="tab" aria-selected="false">
          スポーツ・運動
        </button>
      </div>

      <div class="selection-bar">
        <span id="selected-count-label" class="selected-count-label">修正・確認チェック中：0 件</span>
        <div class="selection-actions">
          <button type="button" id="btn-copy-selected" class="sel-action-btn" disabled>チェックした番号リストをコピー</button>
          <button type="button" id="btn-clear-selected" class="sel-action-btn sel-action-sub" hidden>全解除</button>
        </div>
      </div>

      <div class="mini-legend" aria-label="色の見かた">
        <span class="mini-legend-item">
          <span class="swatch-line swatch-short" aria-hidden="true"></span>
          <span><strong>赤</strong>：縮んで固まる側（原因）</span>
        </span>
        <span class="mini-legend-item">
          <span class="swatch-line swatch-stretch" aria-hidden="true"></span>
          <span><strong>青</strong>：引っぱられて張る側（症状）</span>
        </span>
        <span class="mini-legend-item">
          <span class="swatch-pin" aria-hidden="true"></span>
          <span><strong>金のピン</strong>：骨の付着ポイント</span>
        </span>
      </div>
    </div>
  </section>

  <main class="page-main">
    <div id="checklist-container" class="checklist-grid"></div>
  </main>

  <!-- 共有ライブ3Dプレイヤー（WebGLコンテキストは常に1つだけを共有して超軽量動作） -->
  <div id="shared-live-dock" class="live-dock" hidden>
    <div class="live-stage-wrap" id="live-stage-wrap"></div>
    <div class="live-controls" aria-label="ライブ3Dアニメーション操作">
      <div class="live-quick-btns">
        <button type="button" id="btn-live-zero" class="live-ctrl-btn">最初（0%）</button>
        <button type="button" id="btn-live-hundred" class="live-ctrl-btn">最後（100%）</button>
        <button type="button" id="btn-live-play" class="live-ctrl-btn live-ctrl-primary">一時停止</button>
        <button type="button" id="btn-live-reset-cam" class="live-ctrl-btn">向きを戻す</button>
      </div>
      <div class="live-slider-row">
        <label for="live-scrub-slider" class="live-slider-label">動きの位置（0% ⇄ 100%）</label>
        <span id="live-scrub-readout" class="live-slider-val">50%</span>
      </div>
      <input
        type="range"
        id="live-scrub-slider"
        class="live-slider"
        min="0"
        max="100"
        step="1"
        value="50"
      />
      <p class="live-hint">ドラッグ・スワイプで360度どの角度からも確認できます。</p>
    </div>
  </div>

  <!-- オフスクリーンスナップショット撮影ステージ（ライブドック未使用時のみ保持） -->
  <div id="offscreen-bake-host" style="position:fixed;left:-9999px;top:0;width:440px;height:484px;pointer-events:none;opacity:0;" aria-hidden="true"></div>

  <script type="module" src="js/fascia_check_list.js?v=20261118i"></script>
</body>
</html>
