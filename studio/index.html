<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>制作・同時投稿スタジオ — J.A.R.V.I.S. 接続案内</title>
<style>
  :root {
    --bg: #0B111E;
    --surface: #131C2E;
    --border: rgba(197, 160, 89, 0.28);
    --gold: #C5A059;
    --ink: #F8FAFC;
    --muted: #94A3B8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    line-height: 1.75;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
    color: var(--ink);
    letter-spacing: 0.03em;
    font-weight: 700;
  }
  p {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 22px;
  }
  .status {
    font-size: 13.5px;
    color: #E2E8F0;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 13px 16px;
    border-radius: 12px;
    margin-bottom: 22px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    background: var(--gold);
    color: #0B111E;
    transition: opacity 0.2s ease;
  }
  a.btn:hover { opacity: 0.92; }
  a.btn.sub {
    background: transparent;
    color: #E2E8F0;
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
<main class="card">
  <span class="eyebrow">PRIVATE CREATIVE GATEWAY</span>
  <h1>記事・SNS同時投稿スタジオ</h1>
  <p>セキュリティ保護のため、スタジオは本人認証済みの J.A.R.V.I.S. 総司令室から自動で起動・接続されます。</p>
  <div id="status" class="status">接続先を確認しています…</div>
  <div class="links">
    <a id="btn-jarvis" class="btn" href="https://promisefree-cmyk.github.io/trip/jarvis/">J.A.R.V.I.S. 総司令室からスタジオを開く</a>
    <a class="btn sub" href="http://localhost:8788/apps/studio/">自宅PCで直接スタジオを開く</a>
  </div>
</main>
<script>
(async function() {
  const JARVIS_PORTAL_URL = "https://promisefree-cmyk.github.io/trip/jarvis/";
  const statusEl = document.getElementById("status");
  const btnJarvis = document.getElementById("btn-jarvis");

  async function fetchWithTimeout(url, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      return await fetch(url, { cache: "no-store", signal: ctrl.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  let verifiedStudioUrl = "";
  try {
    const epRes = await fetchWithTimeout("../endpoint.json?t=" + Date.now(), 1500);
    if (epRes.ok) {
      const ep = await epRes.json();
      if (ep && typeof ep.studioTunnelUrl === "string" && ep.studioTunnelUrl.startsWith("https://")) {
        const candidate = ep.studioTunnelUrl.replace(/\/+$/, "") + "/";
        const ping = await fetchWithTimeout(candidate, 2500);
        if (ping.ok) {
          verifiedStudioUrl = candidate;
        }
      }
    }
  } catch (_err) {
    verifiedStudioUrl = "";
  }

  if (verifiedStudioUrl) {
    statusEl.textContent = "稼働中のスタジオを確認しました。移動します…";
    window.location.replace(verifiedStudioUrl);
  } else {
    btnJarvis.href = JARVIS_PORTAL_URL;
    statusEl.textContent = "J.A.R.V.I.S. 総司令室（下のボタン）からスタジオを開いてください。";
  }
})();
</script>
</body>
</html>
